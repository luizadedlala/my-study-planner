<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Study Planner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="planner">
    <h1>My Study Planner</h1>
    <p>Keep track of what you need to study.</p>
    <form id="task-form">
      <input id="task-input" type="text" placeholder="Enter a study task" required>
      <button type="submit">Add task</button>
    </form>
    <ul id="task-list"></ul>
  </main>
  <script src="script.js"></script>
</body>
</html>
